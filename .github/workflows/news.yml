# 시드업 뉴스 심부름꾼 — 텔레그램 채널의 언론사 기사 링크를 1시간마다 시드업 창고(news 표)에 저장
# 2026-09-08 형님 결정: 링크만, AI 없음, 미국장 포함 24시간, 전 회원 공개
# 이 저장소는 공개(public)라 실행 시간이 무제한 무료. 비밀값은 전부 Settings → Secrets 에만 있다.
name: seedup-news
on:
  schedule:
    - cron: '7 * * * *'   # 매시간 07분 (UTC 기준이지만 매시간이라 한국 시간도 매시간)
  workflow_dispatch:

permissions:
  contents: read   # 저장소 읽기만 — 이 작업은 깃허브에 아무것도 쓰지 않는다

concurrency:
  group: seedup-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 뉴스 링크 수집 → 시드업 저장
        run: python news_collect.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          SEEDUP_BOT_EMAIL: ${{ secrets.SEEDUP_BOT_EMAIL }}
          SEEDUP_BOT_PW: ${{ secrets.SEEDUP_BOT_PW }}
